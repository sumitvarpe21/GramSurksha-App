{% load form_tags %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gram Suraksha</title>

    <!-- BOOTSTRAP CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">Gram Suraksha</a>

        {% if request.user.is_authenticated %}
        <div>
            {% if request.user.is_authenticated and request.user.userprofile.is_admin %}
            <a href="{% url 'admin_dashboard' %}" class="btn btn-light me-2">Admin Panel</a>
            {% endif %}

            <a href="/issues/" class="btn btn-light me-2">My Issues</a>
            <a href="/report/" class="btn btn-warning me-2">Report Issue</a>
            <a href="{% url 'profile' %}" class="btn btn-light me-2">Profile</a>
            <a href="{% url 'logout' %}" class="btn btn-danger">Logout</a>
            <a href="/change-password/" class="btn btn-light me-2">Change Password</a>

        </div>
        {% endif %}
    </div>
</nav>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

<!-- BOOTSTRAP JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
